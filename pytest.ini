[pytest]
; Descobre testes apenas nas três pastas do pipeline — exclui o tests/test_view.py
; legado que usa flask_testing.TestCase (não pytest nativo).
testpaths = tests/unit tests/integration tests/acceptance

; Formatação de saída padrão
addopts = -v --tb=short

; Padrões de descoberta
python_files = test_*.py
python_classes = Test*
python_functions = test_*
