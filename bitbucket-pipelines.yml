image: python:3.12-slim

pipelines:
  default:
    # ─────────────────────────────────────────────────────────────────────────
    # ETAPA 1 — COMMIT STAGE
    # Build da aplicação + testes unitários + testes de integração
    # ─────────────────────────────────────────────────────────────────────────
    - step:
        name: "Commit Stage: Build, Testes Unitários e de Integração"
        caches:
          - pip
        script:
          - pip install --no-cache-dir -r requirements.txt
          - pytest tests/unit tests/integration -v --tb=short

    # ─────────────────────────────────────────────────────────────────────────
    # ETAPA 2 — ACCEPTANCE STAGE
    # Testes de aceitação automatizados (jornadas completas de usuário)
    # ─────────────────────────────────────────────────────────────────────────
    - step:
        name: "Acceptance Stage: Testes de Aceitação"
        caches:
          - pip
        script:
          - pip install --no-cache-dir -r requirements.txt
          - pytest tests/acceptance -v --tb=short

    # ─────────────────────────────────────────────────────────────────────────
    # ETAPA 3 — RELEASE STAGE
    # Build da imagem Docker e push para Docker Hub
    #
    # Variáveis de ambiente necessárias (configurar em Bitbucket > Settings >
    # Repository variables):
    #   DOCKER_HUB_USERNAME — seu usuário Docker Hub
    #   DOCKER_HUB_PASSWORD — sua senha / access token Docker Hub
    # ─────────────────────────────────────────────────────────────────────────
    - step:
        name: "Release Stage: Build Docker e Deploy"
        services:
          - docker
        script:
          - docker build -t library-management-system:${BITBUCKET_COMMIT} .
          - echo "Build da imagem concluído com sucesso."
          - |
            if [ -n "$DOCKER_HUB_USERNAME" ] && [ -n "$DOCKER_HUB_PASSWORD" ]; then
              IMAGE_NAME="${DOCKER_HUB_USERNAME}/library-management-system"
              docker tag library-management-system:${BITBUCKET_COMMIT} "${IMAGE_NAME}:latest"
              echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
              docker push "${IMAGE_NAME}:latest"
              echo "Imagem publicada: ${IMAGE_NAME}:latest"
            else
              echo "Credenciais Docker Hub não configuradas — build concluído sem push."
            fi
